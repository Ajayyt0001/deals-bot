name: E-Commerce Deals Bot

on:
  schedule:
    - cron: '0,30 * * * *'   # Every 30 mins — deals
    - cron: '30 3 * * *'     # 9:00 AM IST — trending
    - cron: '30 8 * * *'     # 2:00 PM IST — combo

  workflow_dispatch:
    inputs:
      mode:
        description: 'deals / trending / combo / all'
        required: true
        default: 'all'        # ← default is now ALL so you can test everything at once

jobs:

  # ── DEAL ALERTS (every 30 mins OR manual) ───────────────────────────────────
  deal-alerts:
    name: Deal Alerts (40-99% + ₹1)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0,30 * * * *')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'deals' }}"
          python src/bot.py $MODE

  # ── TRENDING (9 AM IST OR manual with mode=trending) ────────────────────────
  trending-alert:
    name: 🔥 Trending Product of the Day
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'trending') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 3 * * *')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Run Trending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        run: python src/bot.py trending

  # ── COMBO (2 PM IST OR manual with mode=combo) ──────────────────────────────
  combo-alert:
    name: 🎁 Combo/BOGO Deal of the Day
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'combo') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 8 * * *')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Run Combo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        run: python src/bot.py combo
