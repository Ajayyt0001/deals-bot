name: E-Commerce Deals Bot

on:
  schedule:
    # ─── Deal alerts every 30 minutes ───────────────────────────────
    - cron: '0,30 * * * *'        # Every 30 mins (deals)
    
    # ─── Trending product — 9:00 AM IST (3:30 AM UTC) ───────────────
    - cron: '30 3 * * *'          # 9:00 AM IST daily
    
    # ─── Combo/BOGO deal — 2:00 PM IST (8:30 AM UTC) ────────────────
    - cron: '30 8 * * *'          # 2:00 PM IST daily

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: deals / trending / combo / all'
        required: false
        default: 'deals'

jobs:
  # ─── JOB 1: Regular Deal Alerts (every 30 mins) ─────────────────────────────
  deal-alerts:
    name: Deal Alerts (40-99% + ₹1)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && 
       contains(github.event.schedule, '0,30'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Deal Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'deals' }}"
          python src/bot.py $MODE

  # ─── JOB 2: Trending Product (9 AM IST) ─────────────────────────────────────
  trending-alert:
    name: 🔥 Trending Product of the Day
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' && 
      contains(github.event.schedule, '30 3')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Trending Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        run: python src/bot.py trending

  # ─── JOB 3: Combo/BOGO Deal (2 PM IST) ──────────────────────────────────────
  combo-alert:
    name: 🎁 Combo/BOGO Deal of the Day
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' && 
      contains(github.event.schedule, '30 8')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Combo Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          EARNKARO_API_KEY: ${{ secrets.EARNKARO_API_KEY }}
        run: python src/bot.py combo
